name: Build RunPod Irodori v4 image

# このブランチでは現在の本番イメージを維持したまま、チェックポイントだけを
# Irodori-TTS-v4.1-Smallへ更新する。

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: GHCR image tag
        required: true
        default: v4.1-small-20260819
      base_image:
        description: Current production image to overlay on
        required: true
        default: ghcr.io/sa1p/irodori-tts-kohaku-api:v4-small-20260808-lockfix-overlay
      checkpoint_revision:
        description: Irodori-TTS-v4.1-Small revision
        required: true
        default: 2b28324dc263ed5e6638b3cf3dd94c82ead07b4b

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push RunPod image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runpod.v4.1-checkpoint-overlay
          build-args: |
            BASE_IMAGE=${{ inputs.base_image }}
            IRODORI_V41_REVISION=${{ inputs.checkpoint_revision }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/irodori-tts-kohaku-api:${{ inputs.image_tag }}
          provenance: false
          sbom: false
