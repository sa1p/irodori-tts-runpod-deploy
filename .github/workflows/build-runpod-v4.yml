name: Build RunPod Irodori v4 image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: GHCR image tag
        required: true
        default: v4-small-20260802

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push RunPod image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runpod.v4-production
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/irodori-tts-kohaku-api:${{ inputs.image_tag }}
          provenance: false
          sbom: false
