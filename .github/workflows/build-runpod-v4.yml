name: Build RunPod Irodori v4 image

# このブランチでは本番イメージへのオーバーレイをビルドする。
# フルビルドだと ref_latents を別ベースから取り直して chibi_arisu が落ちるため
# (2026-08-08 に 45 -> 44 件になった)。詳細は Dockerfile.runpod.lockfix-overlay。

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: GHCR image tag
        required: true
        default: v4-small-20260808-lockfix-overlay
      base_image:
        description: Base image to overlay on
        required: true
        default: ghcr.io/sa1p/irodori-tts-kohaku-api:v4-small-20260806-chibi-arisu-ref-v2

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push RunPod image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runpod.lockfix-overlay
          build-args: |
            BASE_IMAGE=${{ inputs.base_image }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/irodori-tts-kohaku-api:${{ inputs.image_tag }}
          provenance: false
          sbom: false
