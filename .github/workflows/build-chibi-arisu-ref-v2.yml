name: Build chibi Arisu reference v2 image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: GHCR image tag
        required: true
        default: v4-small-20260806-chibi-arisu-ref-v2

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install latent encoder dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.10.0 torchaudio==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install soundfile huggingface-hub "dacvae @ git+https://github.com/facebookresearch/dacvae@414c20785fc3a28373073ea8ef7a1316eeeaca6e"

      - name: Encode reference WAV as DACVAE latent
        run: |
          python deploy/chibi_arisu/prepare_reference_latent.py \
            deploy/chibi_arisu/reference.wav \
            build/chibi_arisu/reference.pt

      - name: Validate generated latent
        run: |
          python - <<'PY'
          import torch

          path = "build/chibi_arisu/reference.pt"
          latent = torch.load(path, map_location="cpu", weights_only=True)
          assert latent.ndim == 2, latent.shape
          assert latent.shape[-1] == 32, latent.shape
          assert torch.isfinite(latent).all()
          print(f"validated={path} shape={tuple(latent.shape)} dtype={latent.dtype}")
          PY

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push reference overlay
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runpod.chibi-arisu-ref-v2
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/irodori-tts-kohaku-api:${{ inputs.image_tag }}
          provenance: false
          sbom: false
