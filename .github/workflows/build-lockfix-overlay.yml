name: Build lock-fix overlay image

# 本番イメージに api_server.py の修正だけを重ねる。
# フルビルド (build-runpod-v4.yml) は ref_latents を別ベースから取るため
# chibi_arisu が落ちる。モデル構成を変えたくないときはこちらを使う。

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: GHCR image tag
        required: true
        default: v4-small-20260808-lockfix-overlay
      base_image:
        description: Base image to overlay on
        required: true
        default: ghcr.io/sa1p/irodori-tts-kohaku-api:v4-small-20260806-chibi-arisu-ref-v2

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push overlay
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runpod.lockfix-overlay
          build-args: |
            BASE_IMAGE=${{ inputs.base_image }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/irodori-tts-kohaku-api:${{ inputs.image_tag }}
          provenance: false
          sbom: false
